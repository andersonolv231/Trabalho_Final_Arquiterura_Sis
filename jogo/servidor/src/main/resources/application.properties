spring.application.name=missao-marte-servidor
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:localhost}

spring.datasource.url=jdbc:h2:file:${MISSAOMARTE_DADOS:./dados}/missaomarte
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

missaomarte.token.validade-minutos=${MISSAOMARTE_TOKEN_VALIDADE_MINUTOS:120}
